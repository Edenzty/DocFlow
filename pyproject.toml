[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-lab"
version = "0.1.0"
description = "Local evidence-grounded RAG drafts with durable human review and idempotent ticket replies"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.137.1",
  "pydantic==2.13.4",
  "uvicorn==0.49.0",
  "requests==2.33.0",
  "langgraph==1.2.17",
  "langgraph-checkpoint-sqlite==3.1.2",
  "jieba==0.42.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.0", "httpx==0.28.1"]
vector = ["chromadb==1.5.9", "sentence-transformers==5.7.0"]

[project.scripts]
docflow = "docflow_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["docflow_lab*"]

[tool.setuptools.package-data]
docflow_lab = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
